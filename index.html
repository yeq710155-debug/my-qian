<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>谦哥666 · 个人主页</title>
<style>
:root{
  --color-primary:#3F92FF;
  --color-primary-bg:rgba(63,146,255,0.10);
  --color-accent:#33C2CC;
  --color-accent-bg:rgba(51,194,204,0.10);
  --color-bg:#F2F2F5;
  --color-surface:#FFFFFF;
  --color-border:rgba(0,0,0,0.05);
  --color-text:rgba(0,0,0,0.80);
  --color-text-secondary:rgba(0,0,0,0.35);
  --font-base:system-ui,-apple-system,'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  --text-xs:12px;--text-sm:13px;--text-base:15px;--text-lg:18px;
  --text-xl:20px;--text-2xl:24px;--text-3xl:32px;--leading:1.6;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;
  --space-6:24px;--space-8:32px;--space-12:48px;
  --radius-lg:12px;--radius-md:6px;--radius-sm:4px;--radius-pill:999px;
  --shadow-sm:0 2px 8px rgba(0,0,0,0.03);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{
  background:var(--color-bg);color:var(--color-text);
  font-family:var(--font-base);font-size:var(--text-base);
  line-height:var(--leading);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;overflow-wrap:break-word;word-break:break-word;
  -webkit-tap-highlight-color:transparent;
}
.wrap{
  max-width:480px;margin:0 auto;width:100%;
  padding:calc(var(--space-12) + env(safe-area-inset-top)) calc(var(--space-4) + env(safe-area-inset-right)) calc(var(--space-12) + env(safe-area-inset-bottom)) calc(var(--space-4) + env(safe-area-inset-left));
}
.hero{padding-bottom:var(--space-8)}
.avatar{
  width:64px;height:64px;border-radius:var(--radius-lg);
  background:var(--color-primary-bg);color:var(--color-primary);
  border:1px solid var(--color-border);
  display:flex;align-items:center;justify-content:center;
  font-size:var(--text-2xl);font-weight:600;
  margin-bottom:var(--space-4);
}
h1{font-size:var(--text-3xl);font-weight:600;line-height:1.2;letter-spacing:-0.5px}
.sub{color:var(--color-text-secondary);font-size:var(--text-sm);margin-top:var(--space-2)}
.tags{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
.tag{
  font-size:var(--text-xs);
  padding:var(--space-1) var(--space-2);
  border-radius:var(--radius-md);
  background:var(--color-primary-bg);color:var(--color-primary);
}
.tag.alt{background:var(--color-accent-bg);color:var(--color-accent)}
.card{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:var(--radius-lg);
  padding:var(--space-6);
  margin-bottom:var(--space-4);
}
.card h2{font-size:var(--text-2xl);font-weight:600;line-height:1.3;margin-bottom:var(--space-3)}
.card p{font-size:var(--text-base)}
.card p+p{margin-top:var(--space-3)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);margin-bottom:var(--space-4)}
.stat{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-md);padding:var(--space-4);
}
.stat .k{font-size:var(--text-xs);color:var(--color-text-secondary)}
.stat .v{font-size:var(--text-xl);font-weight:600;line-height:1.4;margin-top:var(--space-1)}
.list{list-style:none}
.list li{
  display:flex;align-items:center;gap:var(--space-3);
  padding:var(--space-3) 0;
  border-bottom:1px solid var(--color-border);
}
.list li:last-child{border-bottom:none;padding-bottom:0}
.list svg{flex:none;color:var(--color-primary)}
.cta{
  display:block;width:100%;margin-top:var(--space-6);
  font-family:var(--font-base);font-size:var(--text-base);font-weight:500;
  padding:var(--space-4);
  border:1px solid transparent;border-radius:var(--radius-pill);
  background:var(--color-primary);color:var(--color-surface);
  cursor:pointer;-webkit-appearance:none;appearance:none;
  min-height:48px;line-height:1.2;
  overflow-wrap:break-word;word-break:break-word;
  -webkit-tap-highlight-color:transparent;
  transition:opacity .15s ease;
}
.cta:active{opacity:.88}
footer{
  text-align:center;color:var(--color-text-secondary);
  font-size:var(--text-xs);margin-top:var(--space-8);
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="avatar">谦</div>
    <h1>谦哥666</h1>
    <p class="sub">个人主页 · 作品集</p>
    <div class="tags">
      <span class="tag">前端</span>
      <span class="tag">摄影</span>
      <span class="tag alt">成都</span>
    </div>
  </header>

  <section class="card">
    <h2>关于我</h2>
    <p>你好，我是谦哥。这里放着我的作品和一些正在折腾的东西。</p>
    <p>喜欢把想法做成能打开、能点、真能用起来的页面。</p>
  </section>

  <div class="grid">
    <div class="stat"><div class="k">作品</div><div class="v">12</div></div>
    <div class="stat"><div class="k">最近更新</div><div class="v">2026.11</div></div>
  </div>

  <section class="card">
    <h2>近期作品</h2>
    <ul class="list">
      <li>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        作品集页面改版
      </li>
      <li>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h7"/></svg>
        摄影日志 · 街拍合集
      </li>
      <li>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M5 8l7-5 7 5"/></svg>
        个人博客上线
      </li>
    </ul>
  </section>

  <button class="cta" id="copy" type="button">复制我的微信号</button>
  <footer>谦哥666 · 个人主页</footer>
</div>
<script>
(function(){
  var btn=document.getElementById('copy');
  var id='qian-666';
  var timer;
  function flash(text){
    btn.textContent=text;
    clearTimeout(timer);
    timer=setTimeout(function(){btn.textContent='复制我的微信号';},1800);
  }
  function legacyCopy(text){
    var ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.position='fixed';
    ta.style.top='-1000px';
    ta.style.left='0';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    if(ta.setSelectionRange){ta.setSelectionRange(0,text.length);}
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    document.body.removeChild(ta);
    return ok;
  }
  function done(){
    flash(legacyCopy(id)?('已复制：'+id):('微信号：'+id));
  }
  btn.addEventListener('click',function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(id).then(function(){flash('已复制：'+id);},done);
    }else{
      done();
    }
  });
})();
</script>
</body>
</html>
